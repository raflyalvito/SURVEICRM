<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SURVEICRM - Buat Survei Baru</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase v10 Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-mesh-pattern min-h-screen text-slate-800 pb-16">

  <!-- Glass Navbar -->
  <nav class="glass-nav sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3">
          <a href="index.html" class="p-2 text-slate-400 hover:text-slate-700 rounded-xl hover:bg-slate-100 transition" title="Kembali ke Dashboard">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          </a>
          <div>
            <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight leading-tight">Buat Survei Baru</h1>
            <p class="text-xs text-slate-400">Editor Layar Penuh Kuesioner CRM</p>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
          <a href="index.html" class="px-3.5 py-2 text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
            Batal
          </a>
          <button id="btn-publish-survey" class="inline-flex items-center gap-2 px-5 py-2.5 text-xs sm:text-sm font-bold text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 rounded-xl shadow-md shadow-indigo-500/20 transition transform active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            Publikasikan Survei
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Survey Meta Information Card -->
    <div class="bg-white rounded-3xl border border-indigo-100 p-6 sm:p-8 shadow-xl shadow-indigo-500/5 relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
      
      <div class="space-y-4">
        <div>
          <label for="survey-title" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
            Judul Survei CRM <span class="text-rose-500">*</span>
          </label>
          <input 
            type="text" 
            id="survey-title" 
            class="w-full px-4 py-3 text-base sm:text-xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-2xl focus-glow placeholder-slate-300 transition"
            placeholder="Contoh: Survei Kepuasan Pelanggan Layanan XYZ"
            required
          >
        </div>

        <div>
          <label for="survey-desc" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
            Deskripsi / Petunjuk Pengisian untuk Responden
          </label>
          <textarea 
            id="survey-desc" 
            rows="3" 
            class="w-full px-4 py-2.5 text-xs sm:text-sm text-slate-700 bg-slate-50/50 border border-slate-200 rounded-2xl focus-glow placeholder-slate-400 transition resize-y"
            placeholder="Jelaskan tujuan survei ini dan panduan singkat untuk responden..."
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Questions Container -->
    <div class="space-y-4" id="questions-list">
      <!-- Pertanyaan dinamis akan dirender di sini oleh JavaScript -->
    </div>

    <!-- Add Question Toolbar -->
    <div class="p-6 bg-gradient-to-b from-slate-50/80 to-indigo-50/30 border-2 border-dashed border-slate-200 rounded-3xl text-center">
      <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3.5">Tambah Pertanyaan Baru:</p>
      <div class="flex flex-wrap justify-center gap-3">
        <button 
          type="button" 
          id="btn-add-choice"
          class="inline-flex items-center gap-2 px-4 py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs sm:text-sm font-bold rounded-2xl border border-indigo-200 transition shadow-sm hover:shadow"
        >
          <span class="w-5 h-5 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs">☑</span>
          + Pilihan Ganda
        </button>

        <button 
          type="button" 
          id="btn-add-scale"
          class="inline-flex items-center gap-2 px-4 py-2.5 bg-purple-50 hover:bg-purple-100 text-purple-700 text-xs sm:text-sm font-bold rounded-2xl border border-purple-200 transition shadow-sm hover:shadow"
        >
          <span class="w-5 h-5 rounded-lg bg-purple-600 text-white flex items-center justify-center text-xs">★</span>
          + Skala Penilaian (1 - 5)
        </button>

        <button 
          type="button" 
          id="btn-add-text"
          class="inline-flex items-center gap-2 px-4 py-2.5 bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs sm:text-sm font-bold rounded-2xl border border-sky-200 transition shadow-sm hover:shadow"
        >
          <span class="w-5 h-5 rounded-lg bg-sky-600 text-white flex items-center justify-center text-xs">✍</span>
          + Teks Singkat / Esai
        </button>
      </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="flex justify-end pt-4">
      <button id="btn-publish-survey-bottom" class="inline-flex items-center gap-2 px-7 py-3.5 text-sm font-bold text-white bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 hover:from-indigo-700 hover:to-purple-700 rounded-2xl shadow-lg shadow-indigo-500/25 transition transform active:scale-95">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
        Publikasikan Survei Ini
      </button>
    </div>

  </main>

  <!-- Publish Success Modal -->
  <div id="modal-publish-success" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 text-center">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
      </div>

      <h3 class="text-xl font-black text-slate-900 mb-1">Survei Berhasil Dipublikasikan!</h3>
      <p id="published-survey-title" class="text-xs font-semibold text-slate-600 mb-6">Judul Survei</p>

      <!-- Survey Link Box -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-6 text-left">
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Tautan Responden</label>
        <div class="flex items-center gap-2">
          <input 
            type="text" 
            id="published-survey-url" 
            readonly 
            class="flex-1 px-3 py-2 text-xs sm:text-sm bg-white border border-slate-200 rounded-xl font-mono text-slate-700 select-all"
          >
          <button 
            id="btn-copy-published-url"
            class="px-3.5 py-2 text-xs sm:text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition shrink-0 shadow-sm"
          >
            Salin
          </button>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="space-y-2.5">
        <button 
          id="btn-whatsapp-published"
          class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm transition"
        >
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
          Bagikan Langsung ke WhatsApp
        </button>

        <div class="grid grid-cols-2 gap-2">
          <a 
            id="link-open-published" 
            target="_blank" 
            class="flex items-center justify-center gap-1.5 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-bold rounded-xl transition"
          >
            Buka Form Survei
          </a>
          <a 
            href="index.html" 
            class="flex items-center justify-center gap-1.5 px-4 py-2.5 bg-slate-900 hover:bg-black text-white text-xs sm:text-sm font-bold rounded-xl transition"
          >
            Ke Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/app-builder.js"></script>
</body>
</html>
